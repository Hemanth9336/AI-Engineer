# OpenRouter profile (recommended): one key reaches OpenAI, Anthropic, Google, Meta and more.
# Create a key at https://openrouter.ai/keys and add a few dollars of credit; the whole course costs well under $5.
# Model IDs change over time - see https://openrouter.ai/models, edit the right-hand side, then run: ailab restart

model_list:
  - model_name: lab-mini
    litellm_params: {model: openrouter/openai/gpt-4.1-nano, api_key: os.environ/OPENROUTER_API_KEY}
  - model_name: lab-fast
    litellm_params: {model: openrouter/openai/gpt-4.1-mini, api_key: os.environ/OPENROUTER_API_KEY}
  - model_name: lab-smart
    litellm_params: {model: openrouter/anthropic/claude-sonnet-4.5, api_key: os.environ/OPENROUTER_API_KEY}
  - model_name: lab-reasoning
    litellm_params: {model: openrouter/openai/o4-mini, api_key: os.environ/OPENROUTER_API_KEY}
  - model_name: lab-open
    litellm_params: {model: openrouter/meta-llama/llama-3.3-70b-instruct, api_key: os.environ/OPENROUTER_API_KEY}
  # lab-tiny: lab-mini with a deliberately small 2,048-token input window (FDE skill, context-limit task)
  - model_name: lab-tiny
    litellm_params: {model: openrouter/openai/gpt-4.1-nano, api_key: os.environ/OPENROUTER_API_KEY}
    model_info: {max_input_tokens: 2048}
  # lab-embed: the local embedding service installed by the RAG skill (free, same for every profile)
  - model_name: lab-embed
    litellm_params: {model: openai/all-minilm-l6-v2, api_base: "http://127.0.0.1:4001/v1", api_key: local}

litellm_settings:
  callbacks: ailab_logger.proxy_handler_instance
  drop_params: true
  request_timeout: 300

router_settings:
  enable_pre_call_checks: true

general_settings:
  master_key: os.environ/LAB_AI_KEY

# Ollama profile: free open models running on this machine, no key and no data leaves the VM.
# Needs Ollama (curl -fsSL https://ollama.com/install.sh | sh) and about 8 GB of memory; ailab setup pulls the models.
# Small local models are weaker than hosted ones - fine for learning, slower, and less reliable at tool calling.

model_list:
  - model_name: lab-mini
    litellm_params: {model: ollama_chat/llama3.2:1b, api_base: "http://localhost:11434"}
  - model_name: lab-fast
    litellm_params: {model: ollama_chat/llama3.2:3b, api_base: "http://localhost:11434"}
  - model_name: lab-smart
    litellm_params: {model: ollama_chat/qwen2.5:7b, api_base: "http://localhost:11434"}
  - model_name: lab-reasoning
    litellm_params: {model: ollama_chat/qwen3:4b, api_base: "http://localhost:11434"}
  - model_name: lab-open
    litellm_params: {model: ollama_chat/gemma3:4b, api_base: "http://localhost:11434"}
  # lab-tiny: lab-mini with a deliberately small 2,048-token input window (FDE skill, context-limit task)
  - model_name: lab-tiny
    litellm_params: {model: ollama_chat/llama3.2:1b, api_base: "http://localhost:11434"}
    model_info: {max_input_tokens: 2048}
  # lab-embed: the local embedding service installed by the RAG skill (free, same for every profile)
  - model_name: lab-embed
    litellm_params: {model: openai/all-minilm-l6-v2, api_base: "http://127.0.0.1:4001/v1", api_key: local}

litellm_settings:
  callbacks: ailab_logger.proxy_handler_instance
  drop_params: true
  request_timeout: 300

router_settings:
  enable_pre_call_checks: true

general_settings:
  master_key: os.environ/LAB_AI_KEY
